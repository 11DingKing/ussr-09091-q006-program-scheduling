[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-scheduler"
version = "0.1.0"
description = "研学课程容量编排基础服务"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "redis>=5.1", "celery>=5.4"]

[tool.setuptools.packages.find]
where = ["src"]
